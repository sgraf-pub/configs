---
# file: asahi.yml
- name: Configure Asahi laptop
  hosts: laptop
  remote_user: root
  roles:
    - common
    - { role: linux, become: true }
    - { role: duperemove, become: true }
    - git
    - { role: asahi, become: true }
    - { role: display, become: true }
    - { role: dnf_automatic, become: true }
    - { role: flatpak, become: true }
    - containers
    - { role: google_chrome, become: true }
    - { role: clamav, become: true, when: "ansible_facts['product_name'] | default('') in ['StarLite', 'Mac13,2', '20HMS1FC02'] or ansible_facts['nodename'] | default('') in ['studio', 'x270']" }
    - { role: rpmfusion, become: true, when: "ansible_facts['product_name'] | default('') == 'Mac13,2' or ansible_facts['nodename'] | default('') == 'studio'" }
