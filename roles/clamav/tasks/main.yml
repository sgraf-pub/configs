---
- name: Install ClamAV packages
  ansible.builtin.dnf:
    name:
      - clamav
      - clamav-freshclam
      - clamd
      - clamtk
      - libnotify
    state: present

- name: Enable antivirus_can_scan_system SELinux boolean
  ansible.posix.seboolean:
    name: antivirus_can_scan_system
    state: true
    persistent: true

- name: Add user to virusgroup
  ansible.builtin.user:
    name: "{{ var_user }}"
    groups: virusgroup
    append: true

- name: Remove custom clamd tmpfiles override if present
  ansible.builtin.file:
    path: /etc/tmpfiles.d/clamd.scan.conf
    state: absent

- name: Ensure /run/clamd.scan directory exists
  ansible.builtin.file:
    path: /run/clamd.scan
    state: directory
    owner: clamscan
    group: virusgroup
    mode: "0710"

- name: Configure scan.conf settings
  ansible.builtin.lineinfile:
    path: /etc/clamd.d/scan.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^#?\s*LocalSocket\s+', line: 'LocalSocket /run/clamd.scan/clamd.sock' }
    - { regexp: '^#?\s*LocalSocketGroup\s+', line: 'LocalSocketGroup virusgroup' }
    - { regexp: '^#?\s*User\s+', line: 'User clamscan' }
  notify: Restart clamd@scan

- name: Enable and start ClamAV services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - clamav-freshclam
    - clamd@scan

- name: Ensure Nautilus scripts directory exists
  ansible.builtin.file:
    path: "{{ var_home }}/.local/share/nautilus/scripts"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ var_user }}"

- name: Install Nautilus ClamAV scan script
  ansible.builtin.copy:
    src: Scan with ClamAV (Multi-core)
    dest: "{{ var_home }}/.local/share/nautilus/scripts/Scan with ClamAV (Multi-core)"
    mode: "0755"
  become: true
  become_user: "{{ var_user }}"
