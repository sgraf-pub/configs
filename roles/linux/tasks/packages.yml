---
- name: Install system packages
  ansible.builtin.dnf:
    name:
      # --- Target Basics ---
      - ansible-core
      - ansible-collection-community-general
      - ansible-collection-ansible-posix

      # --- Langpacks ---
      - langpacks-en
      - langpacks-cs

      # --- Tools & Utilities ---
      - ansible-lint
      - bat
      - btrfsmaintenance
      - clamtk
      - compsize
      - cpufetch
      - distrobox
      - duf
      - egl-utils
      - fastfetch
      - firewalld
      - git
      - gnome-backgrounds-extras
      - gnome-shell-extension-appindicator
      - gnome-shell-extension-background-logo
      - gnome-shell-extension-caffeine
      - gnome-shell-extension-freon
      - gnome-tweaks
      - htop
      - inxi
      - lame
      - libva-utils
      - lm_sensors
      - lshw
      - mc
      - mmv
      - mozilla-openh264
      - ncdu
      - nvme-cli
      - powertop
      - pwgen
      - ramalama
      - remove-retired-packages
      - rpmconf
      - screenfetch
      - ShellCheck
      - smartmontools
      - pwgen
      - tldr
      - tmux
      - tuned-utils
      - vim
      - vulkan-tools
      - wget
      - xlsclients
    state: present

- name: Install multimedia packages
  ansible.builtin.dnf:
    name:
      # --- Multimedia ---
      - "@multimedia"
      - ffmpeg-free
    state: present
  when:
    - ansible_facts['product_name'] | default('') != 'StarLite'
    - ansible_facts['product_name'] | default('') != 'Mac13,2'
    - ansible_facts['nodename'] | default('') != 'studio'

- name: Check for Intel GPU
  ansible.builtin.command: lspci -d 8086::03xx
  register: linux_intel_gpu
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install GPU pkgs
  ansible.builtin.dnf:
    name:
      # GPU process and resource utilization monitor (supports i915 and Xe via DRM fdinfo)
      - nvtop
      # Intel Graphics Compute Runtime for OpenCL and oneAPI Level Zero GPU driver
      - intel-compute-runtime
      # Intel GPU debug and performance tools (includes intel_gpu_top)
      - igt-gpu-tools
      # User-space Level Zero driver backend for Intel Neural Processing Unit (NPU)
      - intel-npu-driver
      # OpenCL diagnostic query tool to inspect platforms, devices, and capabilities
      - clinfo
      # oneVPL GPU runtime for Quick Sync hardware video decode/encode (AV1, HEVC, AVC)
      - intel-vpl-gpu-rt
      # Diagnostic tools for oneVPL (includes vpl-inspect to query codec capabilities)
      - libvpl-tools
      # Level Zero diagnostic utility (zello_world) to verify GPU/NPU detection and properties
      - oneapi-level-zero-zello_world
    state: present
  when:
    - linux_intel_gpu.rc == 0
    - linux_intel_gpu.stdout | length > 0
