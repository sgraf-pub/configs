---
- name: Enable auto power management for USB monitor network card
  ansible.builtin.copy:
    content: |
      # Enable auto power management for the monitor's USB network card
      ACTION=="add", SUBSYSTEM=="usb", ATTR{idVendor}=="0bda", ATTR{idProduct}=="8153", TEST=="power/control", ATTR{power/control}="auto"
    dest: /etc/udev/rules.d/99-monitor-network-power.rules
    mode: "0644"
  notify: Reload udev
  when: ansible_facts['product_name'] | default('') == 'NUC15CRSU9'
- name: Remove auto power management rule for USB monitor network card
  ansible.builtin.file:
    path: /etc/udev/rules.d/99-monitor-network-power.rules
    state: absent
  notify: Reload udev
  when: ansible_facts['product_name'] | default('') != 'NUC15CRSU9'
- name: Ignore onboard Intel 2.5G NIC in NetworkManager
  ansible.builtin.copy:
    content: |
      [keyfile]
      unmanaged-devices+=driver:igc
    dest: /etc/NetworkManager/conf.d/99-unmanaged-igc.conf
    mode: "0644"
  notify: Reload NetworkManager
  when: ansible_facts['product_name'] | default('') == 'NUC15CRSU9'
- name: Keep onboard Intel 2.5G NIC administratively down
  ansible.builtin.copy:
    content: |
      ACTION=="add", SUBSYSTEM=="net", DRIVERS=="igc", RUN+="/usr/sbin/ip link set %k down"
    dest: /etc/udev/rules.d/80-down-igc.rules
    mode: "0644"
  notify: Reload udev
  when: ansible_facts['product_name'] | default('') == 'NUC15CRSU9'
- name: Ignore onboard Aquantia 10G NIC in NetworkManager
  ansible.builtin.copy:
    content: |
      [keyfile]
      unmanaged-devices+=driver:atlantic
    dest: /etc/NetworkManager/conf.d/99-unmanaged-atlantic.conf
    mode: "0644"
  notify: Reload NetworkManager
  when: ansible_facts['product_name'] | default('') == 'Mac13,2'
- name: Keep onboard Aquantia 10G NIC administratively down
  ansible.builtin.copy:
    content: |
      ACTION=="add", SUBSYSTEM=="net", DRIVERS=="atlantic", RUN+="/usr/sbin/ip link set %k down"
    dest: /etc/udev/rules.d/80-down-atlantic.rules
    mode: "0644"
  notify: Reload udev
  when: ansible_facts['product_name'] | default('') == 'Mac13,2'
- name: Remove ineffective UCSI udev ignore rule
  ansible.builtin.file:
    path: /etc/udev/rules.d/99-ignore-ucsi-psy.rules
    state: absent
  notify: Reload udev
  when: ansible_facts['product_name'] | default('') == 'NUC15CRSU9'
- name: Unbind ucsi_acpi after the display is up
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Unbind ucsi_acpi to stop USB-C PD uevent floods
      After=display-manager.service
      ConditionPathExists=/sys/bus/platform/drivers/ucsi_acpi/unbind

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      # ignore_device is not valid in systemd 259; udev cannot drop kernel uevents.
      # Unbind after the USB-C DP mux is already configured so the dock/display stay up.
      ExecStart=/bin/sh -c 'if [ -e /sys/bus/platform/devices/USBC000:00/driver ]; then echo USBC000:00 > /sys/bus/platform/drivers/ucsi_acpi/unbind; fi'
      ExecStart=/bin/systemctl restart systemd-udevd.service

      [Install]
      WantedBy=graphical.target
    dest: /etc/systemd/system/unbind-ucsi-acpi.service
    mode: "0644"
  when: ansible_facts['product_name'] | default('') == 'NUC15CRSU9'
- name: Enable unbind-ucsi-acpi service
  ansible.builtin.systemd_service:
    name: unbind-ucsi-acpi.service
    enabled: true
    state: started
    daemon_reload: true
  when: ansible_facts['product_name'] | default('') == 'NUC15CRSU9'
- name: Install powertop service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Powertop tunings

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/bin/powertop --auto-tune
      ExecStartPost=/bin/sh -c \
        'find /sys/bus/usb/drivers/usbhid -regex ".*/[0-9:.-]+" \
        | sed "s|.*/||;s|:.*||" | sort -u \
        | xargs -rI{} sh -c "echo on > /sys/bus/usb/devices/{}/power/control"'

      [Install]
      WantedBy=multi-user.target sleep.target
    dest: /etc/systemd/system/powertop.service
    mode: "0644"
- name: Enable powertop service
  ansible.builtin.systemd_service:
    name: powertop.service
    enabled: true
    daemon_reload: true
- name: Overlay intel_lpmd Arrow Lake-H config to unpark P-cores under load
  ansible.builtin.copy:
    src: intel_lpmd_config_F6_M197_T45.xml
    dest: /etc/intel_lpmd/intel_lpmd_config_F6_M197_T45.xml
    mode: "0644"
  notify: Restart intel_lpmd
  when: ansible_facts['product_name'] | default('') == 'NUC15CRSU9'
- name: Overlay intel_lpmd Meteor Lake-U config to unpark P-cores under load
  ansible.builtin.copy:
    src: intel_lpmd_config_F6_M170_T15.xml
    dest: /etc/intel_lpmd/intel_lpmd_config_F6_M170_T15.xml
    mode: "0644"
  notify: Restart intel_lpmd
  when: ansible_facts['product_name'] | default('') == '21KDS27P0G'
- name: Remove PCIe ASPM powersave policy override
  ansible.builtin.file:
    path: /etc/tmpfiles.d/aspm-powersave.conf
    state: absent
- name: Configure Intel RAPL PL1 power limit
  ansible.builtin.copy:
    content: "w /sys/class/powercap/intel-rapl/intel-rapl:0/constraint_0_power_limit_uw - - - - 10000000\n"
    dest: /etc/tmpfiles.d/rapl-pl1.conf
    mode: "0644"
  when: ansible_facts['product_name'] | default('') == 'StarLite'
- name: Ensure system-sleep directory exists
  ansible.builtin.file:
    path: /usr/lib/systemd/system-sleep
    state: directory
    mode: "0755"
- name: Create sleep hook for power management
  ansible.builtin.copy:
    content: |
      #!/bin/bash

      LOG_TAG="power-management"

      log_battery_status() {
        for dev in /sys/class/power_supply/*; do
          if [ -f "$dev/capacity" ]; then
            bat_name="${dev##*/}"
            capacity=$(cat "$dev/capacity" 2>/dev/null)
            status=$(cat "$dev/status" 2>/dev/null)
            logger -t "$LOG_TAG" "Battery $bat_name: ${capacity}% (${status:-Unknown})"
          fi
        done
      }

      case $1 in
        pre)
          logger -t "$LOG_TAG" "Sleep hook triggered: pre-sleep"
          log_battery_status

          for dev in /sys/class/net/*; do
            if [ -d "$dev/device" ]; then
              if [ -d "$dev/wireless" ] || [ -d "$dev/phy80211" ]; then
                dev_type="wifi"
              else
                dev_type="ethernet"
              fi
              for wakeup_file in "$dev/device/power/wakeup" "$dev/power/wakeup"; do
                if [ -w "$wakeup_file" ]; then
                  echo disabled > "$wakeup_file"
                  logger -t "$LOG_TAG" "Disabled wakeup for $dev_type device ${dev##*/} ($wakeup_file)"
                fi
              done
            fi
          done

          logger -t "$LOG_TAG" "Pre-sleep complete."
          ;;
        post)
          logger -t "$LOG_TAG" "Sleep hook triggered: post-wake"
          log_battery_status

          logger -t "$LOG_TAG" "Post-wake complete."
          ;;
      esac
    dest: /usr/lib/systemd/system-sleep/power-management.sh
    mode: "0755"
- name: Create sleep hook for Realtek card reader suspend fix
  ansible.builtin.copy:
    content: |
      #!/bin/sh

      LOG_TAG="power-management"

      log() {
        logger -t "$LOG_TAG" "$1"
      }

      case $1/$2 in
        pre/*)
          log "Pre-suspend: Unloading Realtek MMC/SD card reader modules..."
          OUT=$(modprobe -r rtsx_usb_sdmmc rtsx_usb_ms rtsx_usb 2>&1)
          STATUS=$?
          [ -n "$OUT" ] && log "$OUT"

          if [ $STATUS -eq 0 ]; then
            log "Pre-suspend: Realtek MMC modules successfully unloaded."
          else
            log "Pre-suspend: Warning - Failed to unload some MMC modules."
          fi
          ;;
        post/*)
          log "Post-suspend: Reloading Realtek MMC/SD card reader modules..."
          OUT=$(modprobe rtsx_usb_sdmmc 2>&1)
          STATUS=$?
          [ -n "$OUT" ] && log "$OUT"

          if [ $STATUS -eq 0 ]; then
            log "Post-suspend: Realtek MMC modules successfully restored."
          else
            log "Post-suspend: Warning - Failed to reload rtsx_usb_sdmmc."
          fi
          ;;
      esac
    dest: /usr/lib/systemd/system-sleep/rtsx-suspend-fix.sh
    mode: "0755"
  when: ansible_facts['product_name'] | default('') == 'StarLite'
