---
- name: Configure vulkan tweaks
  ansible.builtin.copy:
    content: |
      export ANV_DEBUG=video-decode,video-encode
    dest: /etc/profile.d/vulkan.sh
    mode: "0644"
- name: Set timezone
  community.general.timezone:
    name: "Europe/Prague"
- name: Enable IPv6 ndisc notify
  ansible.builtin.copy:
    content: |
      net.ipv6.conf.all.ndisc_notify = 1
      net.ipv6.conf.default.ndisc_notify = 1
    dest: /etc/sysctl.d/ndisc_notify.conf
    mode: "0644"
- name: Do not enable BT at boot
  community.general.ini_file:
    path: /etc/bluetooth/main.conf
    section: Policy
    option: AutoEnable
    value: "false"
    no_extra_spaces: true
    mode: "0644"
- name: Remove disk I/O scheduler udev rule
  ansible.builtin.file:
    path: /etc/udev/rules.d/60-iosched.rules
    state: absent
  notify: Reload udev
- name: Remove dnf5daemon-server service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/dnf5daemon-server.service.d
    state: absent
- name: Ensure geoclue service override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/geoclue.service.d
    state: directory
    mode: "0755"
- name: Configure geoclue service network ordering and restart
  ansible.builtin.copy:
    content: |
      [Unit]
      After=network.target

      [Service]
      Restart=on-failure
      RestartSec=5s
    dest: /etc/systemd/system/geoclue.service.d/network.conf
    mode: "0644"
  notify: Reload systemd
- name: Ensure geoclue configuration directory exists
  ansible.builtin.file:
    path: /etc/geoclue/conf.d
    state: directory
    mode: "0755"
- name: Disable unused geoclue sources
  ansible.builtin.copy:
    content: |
      [network-nmea]
      enable=false

      [3g]
      enable=false

      [cdma]
      enable=false

      [modem-gps]
      enable=false
    dest: /etc/geoclue/conf.d/99-disable-unused-sources.conf
    mode: "0644"
