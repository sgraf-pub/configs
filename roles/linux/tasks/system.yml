---
- name: Configure vulkan tweaks
  ansible.builtin.copy:
    content: |
      export ANV_DEBUG=video-decode,video-encode
    dest: /etc/profile.d/vulkan.sh
    mode: "0644"
- name: Set timezone
  community.general.timezone:
    name: "Europe/Prague"
- name: Enable IPv6 ndisc notify
  ansible.builtin.copy:
    content: |
      net.ipv6.conf.all.ndisc_notify = 1
      net.ipv6.conf.default.ndisc_notify = 1
    dest: /etc/sysctl.d/ndisc_notify.conf
    mode: "0644"
- name: Do not enable BT at boot
  community.general.ini_file:
    path: /etc/bluetooth/main.conf
    section: Policy
    option: AutoEnable
    value: "false"
    no_extra_spaces: true
    mode: "0644"
- name: Remove disk I/O scheduler udev rule
  ansible.builtin.file:
    path: /etc/udev/rules.d/60-iosched.rules
    state: absent
  notify: Reload udev
- name: Remove dnf5daemon-server service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/dnf5daemon-server.service.d
    state: absent
- name: Disable weak dependencies in dnf config
  community.general.ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: install_weak_deps
    value: "False"
    no_extra_spaces: true
    mode: "0644"
- name: Ensure geoclue service override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/geoclue.service.d
    state: directory
    mode: "0755"
- name: Configure geoclue service network ordering and restart
  ansible.builtin.copy:
    content: |
      [Unit]
      After=network.target

      [Service]
      Environment="GIO_USE_PROXY_RESOLVER=dummy"
      Restart=on-failure
      RestartSec=5s
    dest: /etc/systemd/system/geoclue.service.d/network.conf
    mode: "0644"
  notify: Reload systemd
- name: Ensure geoclue configuration directory exists
  ansible.builtin.file:
    path: /etc/geoclue/conf.d
    state: directory
    mode: "0755"
- name: Disable unused geoclue sources
  ansible.builtin.copy:
    content: |
      [network-nmea]
      enable=false

      [3g]
      enable=false

      [cdma]
      enable=false

      [modem-gps]
      enable=false
    dest: /etc/geoclue/conf.d/99-disable-unused-sources.conf
    mode: "0644"
- name: Install boot remount helper
  ansible.builtin.copy:
    src: boot-remount-rw
    dest: /usr/local/sbin/boot-remount-rw
    mode: "0755"
- name: Install boot remount service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Remount /boot read-write after a leaked cryptsetup keydev mount
      Documentation=man:systemd-cryptsetup-generator(8)
      DefaultDependencies=no
      After=boot.mount
      Before=local-fs.target
      ConditionPathIsMountPoint=/boot

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/boot-remount-rw

      [Install]
      WantedBy=local-fs.target
    dest: /etc/systemd/system/boot-remount-rw.service
    mode: "0644"
- name: Enable boot remount service
  ansible.builtin.systemd_service:
    name: boot-remount-rw.service
    enabled: true
    daemon_reload: true
- name: Remove x-systemd.growfs option from /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '(?:(?<=[\s,])x-systemd\.growfs,|,\s*x-systemd\.growfs(?=\s|$))'
    replace: ""
  notify: Reload systemd
- name: Replace standalone x-systemd.growfs option in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '(?<=\s)x-systemd\.growfs(?=\s|$)'
    replace: "defaults"
  notify: Reload systemd
