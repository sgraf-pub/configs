# Custom lm-sensors labels for ThinkPad X270
# Deploy to: /etc/sensors.d/custom.conf
#
# Chip name patterns match the output of `sensors -u`.
# Feature names (temp1, fan1, in0, curr1, ...) are the raw kernel names from `sensors -u`.

# Intel WiFi adapter die temperature
chip "iwlwifi_1_6-virtual-0"
    label temp1 "WiFi"

chip "iwlwifi_1-virtual-0"
    label temp1 "WiFi"

# ACPI thermal zone 0 — mirrors the ThinkPad EC CPU reading
chip "acpitz_0-acpi-0"
    label temp1 "CPU (ACPI)"

chip "acpitz-acpi-0"
    label temp1 "CPU (ACPI)"

# Platform Controller Hub (PCH / Sunrise Point-LP chipset)
chip "pch_skylake-virtual-0"
    label temp1 "PCH"

chip "pch_skylake-*"
    label temp1 "PCH"

# NVMe SSD (pci-0400)
# Composite = overall drive; Sensor 1 = NAND flash die
chip "nvme-pci-0400"
    label temp1 "NVMe Composite"
    label temp2 "NVMe NAND"

# ThinkPad Embedded Controller sensors
# fan1: single system fan (0 RPM at idle/fanless)
# temp2: discrete GPU sensor (not present on Intel integrated graphics)
# temp3–temp8: unused EC thermal registers (read 0 °C)
chip "thinkpad-isa-0000"
    label fan1  "Fan"
    label temp1 "CPU"
    ignore temp2
    ignore temp3
    ignore temp4
    ignore temp5
    ignore temp6
    ignore temp7
    ignore temp8

# Internal battery (ACPI BAT0)
chip "BAT0-acpi-0"
    label in0    "Battery Voltage"
    label curr1  "Battery Current"
    label power1 "Battery Power"

# Removable external battery (ACPI BAT1)
chip "BAT1-acpi-0"
    label in0    "Battery Voltage"
    label curr1  "Battery Current"
    label power1 "Battery Power"
