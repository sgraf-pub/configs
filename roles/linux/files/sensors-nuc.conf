# Custom lm-sensors labels for Intel NUC
# Deploy to: /etc/sensors.d/custom.conf
#
# Chip name patterns match the output of `sensors -u`.
# Feature names (temp1, fan1, in0, curr1, ...) are the raw kernel names from `sensors -u`.

# DDR5 memory temperature (SPD5118 on-DIMM sensor via SMBus)
chip "spd5118-i2c-*-50"
    label temp1 "DDR5 RAM"

# ACPI thermal zones — zone 0 is ambient/system, zone 1 runs closer to CPU
chip "acpitz_0-acpi-0"
    label temp1 "System (ACPI)"

chip "acpitz_1-acpi-0"
    label temp1 "CPU (ACPI)"

# Intel WiFi adapter die temperature
chip "iwlwifi_1_6-virtual-0"
    label temp1 "WiFi"

# NVMe SSD (pci-0100)
# Composite = overall; Sensor 1 = NAND flash; Sensor 2 = controller; Sensor 8 = board/misc
chip "nvme-pci-0100"
    label temp1 "NVMe Composite"
    label temp2 "NVMe NAND"
    label temp3 "NVMe Controller"
    label temp9 "NVMe Board"

# USB-C power delivery ports (UCSI — values are 0 when port is idle)
chip "ucsi_source_psy_USBC000:001-isa-0000"
    label in0   "USB-C1 Voltage"
    label curr1 "USB-C1 Current"

chip "ucsi_source_psy_USBC000:002-isa-0000"
    label in0   "USB-C2 Voltage"
    label curr1 "USB-C2 Current"
