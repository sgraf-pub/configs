# Custom lm-sensors labels for ThinkPad
# Deploy to: /etc/sensors.d/custom.conf
#
# Chip name patterns match the output of `sensors -u`.
# Feature names (temp1, fan1, in0, curr1, ...) are the raw kernel names from `sensors -u`.

# Intel WiFi adapter die temperature
chip "iwlwifi_1_6-virtual-0"
    label temp1 "WiFi"

# ACPI thermal zone 0 — mirrors the ThinkPad EC CPU reading
chip "acpitz_0-acpi-0"
    label temp1 "CPU (ACPI)"

# NVMe SSD (pci-0400)
# Composite = overall drive; Sensor 1 = NAND flash die
chip "nvme-pci-0400"
    label temp1 "NVMe Composite"
    label temp2 "NVMe NAND"

# ThinkPad Embedded Controller sensors
# fan1/fan2: left and right fans (0 RPM at idle/fanless)
# temp3–temp7: EC thermal zones (unused/0 °C on this model at idle)
chip "thinkpad-isa-0000"
    label fan1  "Fan Left"
    label fan2  "Fan Right"
    label temp3 "EC Zone (PCH)"
    label temp4 "EC Zone (Memory)"
    label temp5 "EC Zone 5"
    label temp6 "EC Zone 6"
    label temp7 "EC Zone 7"

# Battery (ACPI)
chip "BAT0-acpi-0"
    label in0    "Battery Voltage"
    label power1 "Battery Power"

# ACPI fan (ambient/chassis)
chip "acpi_fan-isa-0000"
    label fan1 "Ambient Fan"

# USB-C power delivery ports (UCSI — values are 0 when port is idle)
chip "ucsi_source_psy_USBC000:001-isa-0000"
    label in0   "USB-C1 Voltage"
    label curr1 "USB-C1 Current"

chip "ucsi_source_psy_USBC000:002-isa-0000"
    label in0   "USB-C2 Voltage"
    label curr1 "USB-C2 Current"
