# Custom lm-sensors labels for Apple Mac Studio
# Deploy to: /etc/sensors.d/custom.conf
#
# Chip name patterns match the output of `sensors -u`.
# Feature names (temp1, fan1, in0, curr1, ...) are the raw kernel names from `sensors -u`.

# Texas Instruments TAS2764 speaker amplifier die temperature
chip "tas2764-i2c-*-38"
    label temp1 "Speaker Amp"

chip "tas2764-*"
    label temp1 "Speaker Amp"

# Apple NVMe SSD (isa-0000)
chip "nvme-isa-0000"
    label temp1 "NVMe Composite"

# Aquantia AQC113 10GbE Ethernet
chip "end0-pci-0300"
    label temp1 "Ethernet PHY"
    label temp2 "Ethernet MAC"

chip "*-pci-0300"
    label temp1 "Ethernet PHY"
    label temp2 "Ethernet MAC"

# Apple SMC hardware monitor (macsmc_hwmon)
chip "macsmc_hwmon-isa-0000"
    label temp1  "NAND Flash Temperature"
    label fan1   "Fan 1"
    label fan2   "Fan 2"
    label in0    "AC Input Voltage"
    label curr1  "AC Input Current"
    label power1 "Total System Power"
    label power2 "AC Input Power"
    label power3 "3.8 V Rail Power"
