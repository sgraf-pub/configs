---
- name: Restart tuned
  ansible.builtin.systemd_service:
    name: tuned.service
    state: restarted

- name: Reload udev
  ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger

- name: Reload NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager.service
    state: reloaded
