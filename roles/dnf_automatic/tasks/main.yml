---
- name: Install dnf-automatic package
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present
    install_weak_deps: false

- name: Configure /etc/dnf/automatic.conf commands
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0644"
  loop:
    - { option: download_updates, value: "yes" }
    - { option: apply_updates, value: "yes" }
    - { option: reboot, value: "never" }
    - { option: network_online_timeout, value: "300" }

- name: Enable and start dnf-automatic.timer
  ansible.builtin.systemd_service:
    name: dnf-automatic.timer
    state: started
    enabled: true

- name: Ensure dnf-makecache service override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/dnf-makecache.service.d
    state: directory
    mode: "0755"

- name: Wait for network before dnf-makecache
  ansible.builtin.copy:
    src: dnf-makecache-wait-network.conf
    dest: /etc/systemd/system/dnf-makecache.service.d/wait-network.conf
    mode: "0644"
  notify: Reload systemd

- name: Ensure /etc/dconf/db/local.d directory exists
  ansible.builtin.file:
    path: /etc/dconf/db/local.d
    state: directory
    mode: "0755"

- name: Configure GNOME Software update settings
  ansible.builtin.copy:
    content: |
      [org/gnome/software]
      download-updates=true
      download-updates-notify=true
      allow-updates=true
    dest: /etc/dconf/db/local.d/00-gnome-software
    mode: "0644"
  notify: Update dconf database

- name: Stop and disable legacy flatpak and fwupd services and timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - flatpak-update.timer
    - flatpak-update.service
    - fwupd-refresh.timer
  failed_when: false

- name: Remove legacy flatpak-update service and timer files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/flatpak-update.service
    - /etc/systemd/system/flatpak-update.timer
  notify: Reload systemd
