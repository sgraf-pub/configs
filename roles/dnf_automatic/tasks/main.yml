---
- name: Install dnf-automatic package
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present

- name: Configure /etc/dnf/automatic.conf commands
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0644"
  loop:
    - { option: download_updates, value: "yes" }
    - { option: apply_updates, value: "yes" }
    - { option: reboot, value: "never" }

- name: Enable and start dnf-automatic.timer
  ansible.builtin.systemd_service:
    name: dnf-automatic.timer
    state: started
    enabled: true

- name: Ensure /etc/dconf/db/local.d directory exists
  ansible.builtin.file:
    path: /etc/dconf/db/local.d
    state: directory
    mode: "0755"

- name: Configure GNOME Software update settings
  ansible.builtin.copy:
    content: |
      [org/gnome/software]
      download-updates=false
      download-updates-notify=false
    dest: /etc/dconf/db/local.d/00-gnome-software
    mode: "0644"
  notify: Update dconf database

- name: Copy flatpak-update.service
  ansible.builtin.copy:
    src: flatpak-update.service
    dest: /etc/systemd/system/flatpak-update.service
    mode: "0644"

- name: Copy flatpak-update.timer
  ansible.builtin.copy:
    src: flatpak-update.timer
    dest: /etc/systemd/system/flatpak-update.timer
    mode: "0644"

- name: Enable and start flatpak-update.timer
  ansible.builtin.systemd_service:
    name: flatpak-update.timer
    state: started
    enabled: true

- name: Install fwupd package
  ansible.builtin.dnf:
    name: fwupd
    state: present

- name: Enable and start fwupd-refresh.timer
  ansible.builtin.systemd_service:
    name: fwupd-refresh.timer
    state: started
    enabled: true

