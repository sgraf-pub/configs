---
- name: Install intel-media-driver on StarLite
  when: ansible_facts['product_name'] | default('') == 'StarLite'
  block:
    - name: Check for Intel GPU
      ansible.builtin.command: lspci -d 8086::03xx
      register: intel_media_driver_intel_gpu
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install RPM Fusion non-free repository release package
      ansible.builtin.dnf:
        name: "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
        state: present
        disable_gpg_check: true
      become: true
      when:
        - intel_media_driver_intel_gpu.rc == 0
        - intel_media_driver_intel_gpu.stdout | length > 0

    - name: Check if /usr/share/dnf5/repos.d/rpmfusion-nonfree.repo exists
      ansible.builtin.stat:
        path: /usr/share/dnf5/repos.d/rpmfusion-nonfree.repo
      register: intel_media_driver_dnf5_repo_stat
      when:
        - intel_media_driver_intel_gpu.rc == 0
        - intel_media_driver_intel_gpu.stdout | length > 0

    - name: Set intel_media_driver_repo_dir
      ansible.builtin.set_fact:
        intel_media_driver_repo_dir: "{{ '/usr/share/dnf5/repos.d' if (intel_media_driver_dnf5_repo_stat.stat.exists | default(false)) else '/etc/yum.repos.d' }}"
      when:
        - intel_media_driver_intel_gpu.rc == 0
        - intel_media_driver_intel_gpu.stdout | length > 0

    - name: Restrict rpmfusion-nonfree repo to intel-media-driver
      community.general.ini_file:
        path: "{{ intel_media_driver_repo_dir }}/rpmfusion-nonfree.repo"
        section: rpmfusion-nonfree
        option: includepkgs
        value: intel-media-driver,rpmfusion-nonfree-release
        no_extra_spaces: true
        mode: "0644"
      become: true
      when:
        - intel_media_driver_intel_gpu.rc == 0
        - intel_media_driver_intel_gpu.stdout | length > 0

    - name: Restrict rpmfusion-nonfree-updates repo to intel-media-driver
      community.general.ini_file:
        path: "{{ intel_media_driver_repo_dir }}/rpmfusion-nonfree-updates.repo"
        section: rpmfusion-nonfree-updates
        option: includepkgs
        value: intel-media-driver,rpmfusion-nonfree-release
        no_extra_spaces: true
        mode: "0644"
      become: true
      when:
        - intel_media_driver_intel_gpu.rc == 0
        - intel_media_driver_intel_gpu.stdout | length > 0

    - name: Install intel-media-driver
      ansible.builtin.dnf:
        name: intel-media-driver
        state: present
      become: true
      when:
        - intel_media_driver_intel_gpu.rc == 0
        - intel_media_driver_intel_gpu.stdout | length > 0
