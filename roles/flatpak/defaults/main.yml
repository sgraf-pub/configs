---
# Installation method for Flatpak packages: 'system' or 'user'
flatpak_installation_method: system

# Whether to autoremove unused dependencies when removing RPM packages
flatpak_rpm_autoremove: true

# Whether to allow erasing installed packages to resolve dependency conflicts
flatpak_rpm_allowerasing: true

# Whether to enable Tier 2 GNOME applications (Flatpaks with integration requirements)
flatpak_enable_tier2_gnome_apps: true

# Flatpak remote repositories to configure
flatpak_remotes:
  - name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    state: present

# List of RPM packages to remove in favor of Flatpaks
flatpak_rpm_packages_to_remove:
  - gnome-boxes
  - libreoffice-core
  - libreoffice-writer
  - libreoffice-calc
  - libreoffice-impress
  - libreoffice-draw
  - libreoffice-base
  - mediawriter
  # Tier 1 GNOME applications explanation:
  # - What "Tier 1" means: Standalone "leaf" user-facing applications (calculators, viewers,
  #   text editors, camera) that rely strictly on standard XDG Desktop Portals (file chooser,
  #   notifications, camera, dark mode).
  # - Why they are safe to replace: They have no low-level system daemon dependencies, host
  #   DBus service provisions (unlike Nautilus's FileManager1), or host hardware/process
  #   privileges (unlike Settings, Disks, System Monitor, Terminal).
  # - Integration behavior: Shell search provider integration, MIME associations, and desktop
  #   icons are cleanly exported by Flatpak without breaking desktop workflows.
  # - Exclusion note: Tier 2 GNOME applications (Calendar, Contacts, etc.) are managed
  #   separately via flatpak_enable_tier2_gnome_apps. System apps like Nautilus, Settings,
  #   System Monitor, or Terminal (Tier 3) remain native RPMs.
  # Tier 1 GNOME applications (including legacy/alternative package names)
  - gnome-calculator
  - gnome-characters
  - gnome-extensions-app
  - gnome-font-viewer
  - gnome-text-editor
  - gedit
  - loupe
  - eog
  - showtime
  - totem
  - snapshot
  - cheese
  - epiphany
  - decibels
  - gnome-sound-recorder

# Tier 2 GNOME applications explanation:
# - What "Tier 2" means: GNOME applications that function well as Flatpaks but have specific
#   host integration characteristics, portal dependencies, or sandbox permission requirements:
#   - Baobab (Disk Usage Analyzer): Filesystem isolation restricts default visibility. Requires
#     a filesystem override (host:ro) to inspect host disk usage effectively.
#   - Calendar & Contacts: Evolution-Data-Server (EDS) sync vs GNOME Online Accounts (GOA).
#     In Flatpak, they interface with EDS / GOA through portals and D-Bus services rather than
#     direct local database access, enabling calendar and contact sync with online accounts.
#   - Clocks: Relies on the XDG Desktop Background portal (org.freedesktop.portal.Background)
#     and notifications to ensure alarms and timers trigger reliably when closed.
#   - Maps: Relies on the Geoclue location portal (org.freedesktop.portal.Location)
#     and exports a GNOME Shell search provider for place queries.
#   - Weather: Relies on the Geoclue location portal (org.freedesktop.portal.Location)
#     to provide location-based automatic weather updates.
#   - Papers (and Evince): Modern document/PDF viewer. While the viewer itself runs sandboxed,
#     PDF thumbnail generation in Nautilus requires host-level thumbnailers (papers-thumbnailer RPM).
#   - Simple Scan (Document Scanner): Uses USB device access and network discovery (eSCL/AirScan)
#     for scanning. Works out-of-the-box for driverless and standard SANE-supported scanners;
#     proprietary host-only driver plugins cannot be reached inside the sandbox.
# List of Tier 2 RPM packages to remove when flatpak_enable_tier2_gnome_apps is true
flatpak_tier2_rpm_packages_to_remove:
  - baobab
  - gnome-calendar
  - gnome-clocks
  - gnome-contacts
  - gnome-maps
  - gnome-weather
  - papers
  - evince
  - simple-scan

# List of Flatpak packages to install
flatpak_packages:
  - org.gnome.Boxes
  - org.libreoffice.LibreOffice
  - org.fedoraproject.MediaWriter
  # Tier 1 GNOME applications
  - org.gnome.Calculator
  - org.gnome.Characters
  - org.gnome.Decibels
  - org.gnome.Epiphany
  - org.gnome.Extensions
  - org.gnome.font-viewer
  - org.gnome.Loupe
  - org.gnome.Showtime
  - org.gnome.Snapshot
  - org.gnome.SoundRecorder
  - org.gnome.TextEditor

# List of Tier 2 Flatpak packages to install when flatpak_enable_tier2_gnome_apps is true
flatpak_tier2_packages:
  - org.gnome.baobab
  - org.gnome.Calendar
  - org.gnome.clocks
  - org.gnome.Contacts
  - org.gnome.Maps
  - org.gnome.Papers
  - org.gnome.SimpleScan
  - org.gnome.Weather

# List of RPM packages to ensure installed after Flatpak replacements and autoremove
flatpak_post_rpm_packages:
  - langpacks-en

# List of Tier 2 RPM packages to ensure installed after Flatpak replacements and autoremove
flatpak_tier2_post_rpm_packages:
  - papers-thumbnailer
  - papers-previewer
  - papers-nautilus

# Flatpak system overrides to configure for active Flatpak packages
flatpak_overrides:
  - name: org.gnome.baobab
    filesystems:
      - host:ro

