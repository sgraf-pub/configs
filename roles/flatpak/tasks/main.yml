---
- name: Determine active package lists
  ansible.builtin.set_fact:
    _flatpak_active_rpm_packages_to_remove: "{{ flatpak_rpm_packages_to_remove | default([]) + (flatpak_tier2_rpm_packages_to_remove | default([]) if flatpak_enable_tier2_gnome_apps | default(false) else []) }}"
    _flatpak_active_packages: "{{ flatpak_packages | default([]) + (flatpak_tier2_packages | default([]) if flatpak_enable_tier2_gnome_apps | default(false) else []) }}"
    _flatpak_active_post_rpm_packages: "{{ flatpak_post_rpm_packages | default([]) + (flatpak_tier2_post_rpm_packages | default([]) if flatpak_enable_tier2_gnome_apps | default(false) else []) }}"

- name: Ensure flatpak is installed
  ansible.builtin.dnf:
    name: flatpak
    state: present

- name: Configure Flatpak remotes
  community.general.flatpak_remote:
    name: "{{ item.name }}"
    flatpakrepo_url: "{{ item.flatpakrepo_url }}"
    method: "{{ item.method | default(flatpak_installation_method) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ flatpak_remotes }}"
  when: flatpak_remotes is defined and flatpak_remotes | length > 0

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto
  when: _flatpak_active_rpm_packages_to_remove is defined and _flatpak_active_rpm_packages_to_remove | length > 0

- name: Filter installed RPM packages to remove
  ansible.builtin.set_fact:
    _flatpak_installed_rpms: "{{ _flatpak_active_rpm_packages_to_remove | select('in', ansible_facts.packages) | list }}"
  when:
    - _flatpak_active_rpm_packages_to_remove is defined
    - _flatpak_active_rpm_packages_to_remove | length > 0
    - ansible_facts.packages is defined

- name: Remove RPM packages replaced by Flatpaks
  ansible.builtin.dnf:
    name: "{{ _flatpak_installed_rpms }}"
    state: absent
    autoremove: "{{ flatpak_rpm_autoremove }}"
    allowerasing: "{{ flatpak_rpm_allowerasing }}"
  when:
    - _flatpak_installed_rpms is defined
    - _flatpak_installed_rpms | length > 0

- name: Install Flatpak packages
  community.general.flatpak:
    name: "{{ item.name | default(item) }}"
    remote: "{{ item.remote | default('flathub') }}"
    method: "{{ item.method | default(flatpak_installation_method) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ _flatpak_active_packages }}"
  when: _flatpak_active_packages is defined and _flatpak_active_packages | length > 0

- name: Ensure post-removal RPM packages are installed
  ansible.builtin.dnf:
    name: "{{ _flatpak_active_post_rpm_packages }}"
    state: present
  when: _flatpak_active_post_rpm_packages is defined and _flatpak_active_post_rpm_packages | length > 0

- name: Ensure Flatpak overrides directory exists
  ansible.builtin.file:
    path: /var/lib/flatpak/overrides
    state: directory
    mode: "0755"
  when: flatpak_overrides is defined and flatpak_overrides | length > 0

- name: Configure Flatpak system overrides
  community.general.ini_file:
    path: "/var/lib/flatpak/overrides/{{ item.name }}"
    section: Context
    option: filesystems
    value: "{{ ((item.filesystems | join(';')) | regex_replace(';+$', '')) ~ ';' }}"
    mode: "0644"
    no_extra_spaces: true
  loop: "{{ flatpak_overrides | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.name in (_flatpak_active_packages | default([]) | select('mapping') | map(attribute='name') | list + _flatpak_active_packages | default([]) | select('string') | list)
    - item.filesystems is defined

