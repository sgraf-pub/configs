---
- name: Get UUID for dm-0
  ansible.builtin.command: blkid /dev/dm-0 -s UUID -o value
  register: duperemove_uuid
  changed_when: false
  failed_when: false

- name: Stop and disable beesd service
  ansible.builtin.systemd_service:
    name: "beesd@{{ duperemove_uuid.stdout }}.service"
    state: stopped
    enabled: false
  when: duperemove_uuid.rc == 0 and (duperemove_uuid.stdout | trim | length > 0)
  failed_when: false

- name: Stop and disable bees weekly timer
  ansible.builtin.systemd_service:
    name: "bees-weekly@{{ duperemove_uuid.stdout }}.timer"
    state: stopped
    enabled: false
  when: duperemove_uuid.rc == 0 and (duperemove_uuid.stdout | trim | length > 0)
  failed_when: false

- name: Clean up beeshome directory
  when: duperemove_uuid.rc == 0 and (duperemove_uuid.stdout | trim | length > 0)
  block:
    - name: Mount UUID volume for beeshome cleanup
      ansible.posix.mount:
        path: /mnt
        src: "UUID={{ duperemove_uuid.stdout }}"
        fstype: btrfs
        state: ephemeral
      failed_when: false

    - name: Remove .beeshome directory
      ansible.builtin.file:
        path: /mnt/.beeshome
        state: absent

    - name: Unmount UUID volume after beeshome cleanup
      ansible.posix.mount:
        path: /mnt
        state: unmounted
      failed_when: false

- name: Remove bees service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/beesd@.service.d
    state: absent

- name: Remove bees weekly wrapper service
  ansible.builtin.file:
    path: /etc/systemd/system/bees-weekly@.service
    state: absent

- name: Remove bees weekly timer
  ansible.builtin.file:
    path: /etc/systemd/system/bees-weekly@.timer
    state: absent

- name: Remove bees config directory
  ansible.builtin.file:
    path: /etc/bees
    state: absent

- name: Remove bees package
  ansible.builtin.dnf:
    name: bees
    state: absent
