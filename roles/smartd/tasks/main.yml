---
- name: Install smartmontools and libnotify packages
  ansible.builtin.dnf:
    name:
      - smartmontools
      - libnotify
    state: present

- name: Ensure /etc/smartmontools directory exists
  ansible.builtin.file:
    path: /etc/smartmontools
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Template smartd configuration
  ansible.builtin.template:
    src: smartd.conf.j2
    dest: /etc/smartmontools/smartd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart smartd

- name: Ensure /etc/smartd.conf symlink exists for backward compatibility
  ansible.builtin.file:
    src: /etc/smartmontools/smartd.conf
    dest: /etc/smartd.conf
    state: link
    force: true

- name: Enable and start smartd service
  ansible.builtin.systemd_service:
    name: smartd.service
    state: started
    enabled: true
