---
- name: Select Studio display profile
  ansible.builtin.set_fact:
    display_monitors_src: studio-monitors.xml
    display_video_arg: video=HDMI-A-1:3440x1440@100
  when: ansible_facts['product_name'] | default('') == 'Mac13,2' or ansible_facts['nodename'] | default('') == 'studio'

- name: Select NUC display profile
  ansible.builtin.set_fact:
    display_monitors_src: nuc-monitors.xml
    display_video_arg: video=DP-3:3440x1440@100
  when: ansible_facts['product_name'] | default('') == 'NUC15CRSU9'

- name: Ensure GDM config directory exists
  ansible.builtin.file:
    path: /var/lib/gdm/.config
    state: directory
    owner: gdm
    group: gdm
    mode: "0755"
  when: display_monitors_src is defined

- name: Deploy GDM monitors.xml configuration
  ansible.builtin.copy:
    src: "{{ display_monitors_src }}"
    dest: /var/lib/gdm/.config/monitors.xml
    owner: gdm
    group: gdm
    mode: "0644"
  when: display_monitors_src is defined

- name: Deploy system-wide monitors.xml for GDM
  ansible.builtin.copy:
    src: "{{ display_monitors_src }}"
    dest: /etc/xdg/monitors.xml
    owner: root
    group: root
    mode: "0644"
  when: display_monitors_src is defined

- name: Check kernel cmdline for video mode
  ansible.builtin.slurp:
    src: /etc/kernel/cmdline
  register: display_kernel_cmdline
  when: display_video_arg is defined

- name: Set TTY and early boot video resolution
  ansible.builtin.command: grubby --update-kernel=ALL --args="{{ display_video_arg }}"
  changed_when: true
  when: display_video_arg is defined and display_video_arg not in (display_kernel_cmdline.content | b64decode)

- name: Install terminus console fonts
  ansible.builtin.dnf:
    name: terminus-fonts-console
    state: present
  when: display_console_font.startswith('ter-')

- name: Set console font
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: '^FONT='
    line: "FONT={{ display_console_font }}"
    create: true
    mode: "0644"
