---
- name: Ensure GDM config directory exists
  ansible.builtin.file:
    path: /var/lib/gdm/.config
    state: directory
    owner: gdm
    group: gdm
    mode: "0755"
  when: ansible_facts['product_name'] | default('') == 'Mac13,2' or ansible_facts['nodename'] | default('') == 'studio'

- name: Deploy GDM monitors.xml configuration
  ansible.builtin.copy:
    src: monitors.xml
    dest: /var/lib/gdm/.config/monitors.xml
    owner: gdm
    group: gdm
    mode: "0644"
  when: ansible_facts['product_name'] | default('') == 'Mac13,2' or ansible_facts['nodename'] | default('') == 'studio'

- name: Deploy system-wide monitors.xml for GDM (Studio)
  ansible.builtin.copy:
    src: monitors.xml
    dest: /etc/xdg/monitors.xml
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts['product_name'] | default('') == 'Mac13,2' or ansible_facts['nodename'] | default('') == 'studio'

- name: Check kernel cmdline for video mode
  ansible.builtin.slurp:
    src: /etc/kernel/cmdline
  register: display_kernel_cmdline
  when: ansible_facts['product_name'] | default('') == 'Mac13,2' or ansible_facts['nodename'] | default('') == 'studio'

- name: Set TTY and early boot video resolution for Studio
  ansible.builtin.command: grubby --update-kernel=ALL --args="video=HDMI-A-1:3440x1440@100"
  changed_when: true
  when:
    - ansible_facts['product_name'] | default('') == 'Mac13,2' or ansible_facts['nodename'] | default('') == 'studio'
    - "'video=HDMI-A-1:3440x1440@100' not in (display_kernel_cmdline.content | b64decode)"

- name: Install terminus console fonts
  ansible.builtin.dnf:
    name: terminus-fonts-console
    state: present
  when: display_console_font.startswith('ter-')

- name: Set console font
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: '^FONT='
    line: "FONT={{ display_console_font }}"
    create: true
    mode: "0644"
