---
- name: Clean up Studio and NUC display resolution overrides
  when: >-
    ansible_facts['product_name'] | default('') in ['Mac13,2', 'NUC15CRSU9']
    or ansible_facts['nodename'] | default('') == 'studio'
  block:
    - name: Remove GDM and system-wide monitors.xml overrides
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/gdm/.config/monitors.xml
        - /etc/xdg/monitors.xml

    - name: Check if kernel cmdline file exists
      ansible.builtin.stat:
        path: /etc/kernel/cmdline
      register: display_kernel_cmdline_file

    - name: Read kernel cmdline for legacy video mode args
      ansible.builtin.slurp:
        src: /etc/kernel/cmdline
      register: display_kernel_cmdline
      when: display_kernel_cmdline_file.stat.exists

    - name: Remove legacy TTY and early boot video resolution args
      ansible.builtin.command:
        cmd: grubby --update-kernel=ALL --remove-args="{{ item }}"
      loop:
        - video=HDMI-A-1:3440x1440@100
        - video=DP-3:3440x1440@100
      changed_when: true
      when:
        - display_kernel_cmdline_file.stat.exists
        - display_kernel_cmdline.content is defined
        - item in (display_kernel_cmdline.content | b64decode)

- name: Install terminus console fonts
  ansible.builtin.dnf:
    name: terminus-fonts-console
    state: present
    install_weak_deps: false
  when: display_console_font.startswith('ter-')

- name: Set console font
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: '^FONT='
    line: "FONT={{ display_console_font }}"
    create: true
    mode: "0644"
