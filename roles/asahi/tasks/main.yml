---
- name: Install required packages
  ansible.builtin.dnf:
    name:
      # Prepare target basics
      - ansible-core
      - ansible-collection-community-general
      - ansible-collection-ansible-posix
      # Install Fontconfig
      - curl
      - cabextract
      - xorg-x11-font-utils
      - fontconfig
    state: present

- name: Install asahi packages
  ansible.builtin.dnf:
    name:
      - asahi-bless
    state: present
  when: ansible_facts.architecture == 'aarch64'

- name: Check if Microsoft Fonts are already installed
  ansible.builtin.command: rpm -q msttcore-fonts-installer # noqa: command-instead-of-module
  register: asahi_msttcore_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Download Microsoft Fonts installer
  ansible.builtin.get_url:
    url: "https://downloads.sourceforge.net/project/mscorefonts2/rpms/msttcore-fonts-installer-2.6-1.noarch.rpm"
    dest: "/tmp/msttcore-fonts-installer-2.6-1.noarch.rpm"
    checksum: "sha256:55d7f3a86533225634ff3ea2384b4356d9665a29cc7eeacff16602a1714afbb4"
    mode: "0644"
  when: asahi_msttcore_installed.rc != 0

- name: Install Microsoft Fonts
  ansible.builtin.command: rpm -i --nodigest --nosignature /tmp/msttcore-fonts-installer-2.6-1.noarch.rpm # noqa: command-instead-of-module no-changed-when
  when: asahi_msttcore_installed.rc != 0
- name: Enable firewalld
  ansible.builtin.service:
    name: firewalld.service
    enabled: true
    state: started
- name: Configure firewall services
  ansible.posix.firewalld:
    service: "{{ item.service }}"
    permanent: true
    immediate: true
    state: "{{ item.state }}"
  loop:
    - { service: ssh, state: disabled }
    - { service: mdns, state: enabled }
- name: Disable wide port ranges
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: disabled
  loop:
    - 1025-65535/udp
    - 1025-65535/tcp
- name: Check if swap config exist
  ansible.builtin.stat:
    path: /etc/tmpfiles.d/asahi-enable-zswap.conf
  register: asahi_swap
  when: ansible_facts.architecture == 'aarch64'

- name: Update swap config
  ansible.builtin.lineinfile:
    regexp: "compressor"
    line: "w     /sys/module/zswap/parameters/compressor         -    -    -    -    zstd"
    dest: /etc/tmpfiles.d/asahi-enable-zswap.conf
  when:
    - ansible_facts.architecture == 'aarch64'
    - asahi_swap.stat.exists | default(false)

- name: Copy mute-audio.service
  ansible.builtin.copy:
    src: mute-audio.service
    dest: /etc/systemd/user/mute-audio.service
    mode: '0644'
  when: ansible_facts.architecture == 'aarch64'

- name: Enable mute-audio.service globally
  ansible.builtin.systemd:
    name: mute-audio.service
    enabled: true
    scope: global
  when: ansible_facts.architecture == 'aarch64'

- name: Ensure GDM config directory exists
  ansible.builtin.file:
    path: /var/lib/gdm/.config
    state: directory
    owner: gdm
    group: gdm
    mode: "0755"
  when: ansible_facts['product_name'] | default('') == 'Mac13,2' or ansible_facts['nodename'] | default('') == 'studio'

- name: Deploy GDM monitors.xml configuration
  ansible.builtin.copy:
    src: monitors.xml
    dest: /var/lib/gdm/.config/monitors.xml
    owner: gdm
    group: gdm
    mode: "0644"
  when: ansible_facts['product_name'] | default('') == 'Mac13,2' or ansible_facts['nodename'] | default('') == 'studio'

- name: Deploy system-wide monitors.xml for GDM (Studio)
  ansible.builtin.copy:
    src: monitors.xml
    dest: /etc/xdg/monitors.xml
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts['product_name'] | default('') == 'Mac13,2' or ansible_facts['nodename'] | default('') == 'studio'

- name: Check kernel cmdline for video mode
  ansible.builtin.slurp:
    src: /etc/kernel/cmdline
  register: asahi_kernel_cmdline
  when: ansible_facts['product_name'] | default('') == 'Mac13,2' or ansible_facts['nodename'] | default('') == 'studio'

- name: Set TTY and early boot video resolution for Studio
  ansible.builtin.command: grubby --update-kernel=ALL --args="video=HDMI-A-1:3440x1440@100"
  changed_when: true
  when:
    - ansible_facts['product_name'] | default('') == 'Mac13,2' or ansible_facts['nodename'] | default('') == 'studio'
    - "'video=HDMI-A-1:3440x1440@100' not in (asahi_kernel_cmdline.content | b64decode)"

- name: Set large console font for Studio
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: '^FONT='
    line: 'FONT=latarcyrheb-sun32'
    create: true
    mode: "0644"
  when: ansible_facts['product_name'] | default('') == 'Mac13,2' or ansible_facts['nodename'] | default('') == 'studio'
