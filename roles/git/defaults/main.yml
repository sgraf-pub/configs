---
git_user_name: "{{ var_git_name | default('') }}"
git_user_email: "{{ var_git_email | default('') }}"
# yamllint disable-line rule:line-length
git_home: "{{ var_home | default(ansible_facts['user_dir'] | default(ansible_facts['env']['HOME'] | default('~'))) }}"
# First existing public key wins. Set git_signing_key to pin a path.
git_signing_key_candidates:
  - "{{ git_home }}/.ssh/id_ecdsa.pub"
  - "{{ git_home }}/.ssh/id_ed25519.pub"
git_allowed_signers_file: "{{ git_home }}/.config/git/allowed_signers"
