---
# tasks file for performance role

- name: Detect x86-64-v3 capability via dynamic linker
  ansible.builtin.command: /lib64/ld-linux-x86-64.so.2 --help
  register: performance_ld_help
  changed_when: false
  check_mode: false
  failed_when: false
  when: ansible_facts['architecture'] == 'x86_64'

- name: Set performance_has_x86_64_v3 fact
  ansible.builtin.set_fact:
    performance_has_x86_64_v3: "{{ performance_ld_help.stdout is defined and 'x86-64-v3 (supported' in performance_ld_help.stdout }}"
  when: ansible_facts['architecture'] == 'x86_64'

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto
  when: ansible_facts['architecture'] == 'x86_64'

- name: Replace legacy packages with optimized performance alternatives
  ansible.builtin.dnf:
    name: "{{ item.new }}"
    state: present
    allowerasing: "{{ performance_allowerasing }}"
  loop: "{{ performance_package_replacements }}"
  when:
    - ansible_facts['architecture'] == 'x86_64'
    - ansible_facts.packages is defined
    - item.old in ansible_facts.packages
    - item.new not in ansible_facts.packages
    - not item.requires_v3 or (performance_has_x86_64_v3 | default(false) | bool)
  loop_control:
    label: "{{ item.old }} -> {{ item.new }}"

- name: Ensure CPU microcode package is installed on bare-metal systems
  ansible.builtin.dnf:
    name: microcode_ctl
    state: present
  when:
    - ansible_facts['architecture'] == 'x86_64'
    - performance_ensure_microcode | bool
    - ansible_facts['virtualization_role'] | default('') != 'guest'

- name: Ensure pigz is installed
  ansible.builtin.dnf:
    name: pigz
    state: present
  when: performance_symlink_pigz | bool

- name: Create pigz symlinks in /usr/local/bin
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop:
    - src: /usr/bin/pigz
      dest: /usr/local/bin/gzip
    - src: /usr/bin/unpigz
      dest: /usr/local/bin/gunzip
  loop_control:
    label: "{{ item.dest }}"
  when: performance_symlink_pigz | bool

- name: Configure xz multithreading in profile.d
  ansible.builtin.copy:
    content: |
      export XZ_OPT="-T0"
    dest: /etc/profile.d/xz.sh
    mode: "0644"
  when: performance_enable_xz_multithreading | bool

- name: Configure zstd multithreading in profile.d
  ansible.builtin.copy:
    content: |
      export ZSTD_NBTHREADS="0"
    dest: /etc/profile.d/zstd.sh
    mode: "0644"
  when: performance_enable_zstd_multithreading | bool

- name: Set dracut image compression
  ansible.builtin.copy:
    content: |
      compress="zstd -1 -T0 -q"
    dest: /etc/dracut.conf.d/compress.conf
    mode: "0644"
  when: performance_dracut_compression | bool

- name: Configure TCP BBR congestion control algorithm
  ansible.builtin.copy:
    content: |
      net.core.default_qdisc = fq
      net.ipv4.tcp_congestion_control = bbr
    dest: /etc/sysctl.d/tcp_congestion_control.conf
    mode: "0644"
  when: performance_tcp_bbr | bool

- name: Set zram size
  community.general.ini_file:
    path: /etc/systemd/zram-generator.conf
    section: zram0
    option: zram-size
    value: "{{ performance_zram_size }}"
    mode: "0644"
  when: performance_configure_zram | bool

- name: Set zram compression algorithm
  community.general.ini_file:
    path: /etc/systemd/zram-generator.conf
    section: zram0
    option: compression-algorithm
    value: "{{ performance_zram_algorithm }}"
    mode: "0644"
  when: performance_configure_zram | bool and performance_zram_algorithm | length > 0

- name: Set VM memory sysctl
  ansible.builtin.copy:
    content: |
      vm.swappiness = {{ performance_vm_swappiness }}
      vm.page-cluster = {{ performance_vm_page_cluster }}
    dest: /etc/sysctl.d/swappiness.conf
    mode: "0644"
  when: performance_configure_swappiness | bool

- name: Configure vm.max_map_count
  ansible.builtin.copy:
    content: |
      vm.max_map_count = {{ performance_vm_max_map_count }}
    dest: /etc/sysctl.d/10-map-count.conf
    mode: "0644"
  when: performance_configure_max_map_count | bool

- name: Configure inotify sysctl limits
  ansible.builtin.copy:
    content: |
      fs.inotify.max_user_watches = {{ performance_fs_inotify_max_user_watches }}
      fs.inotify.max_user_instances = {{ performance_fs_inotify_max_user_instances }}
    dest: /etc/sysctl.d/inotify.conf
    mode: "0644"
  when: performance_configure_inotify | bool

- name: Configure transparent hugepage policies
  ansible.builtin.copy:
    content: |
      w /sys/kernel/mm/transparent_hugepage/shmem_enabled - - - - advise
      w /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
    dest: /etc/tmpfiles.d/thp.conf
    mode: "0644"
  when: performance_configure_thp | bool

- name: Remove obsolete thp-shmem-advise.conf
  ansible.builtin.file:
    path: /etc/tmpfiles.d/thp-shmem-advise.conf
    state: absent
